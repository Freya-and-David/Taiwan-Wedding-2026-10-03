<!doctype html>
<!-- 分享預覽圖模板：以 1200×630 截圖成 assets/img/og-image.png（做法見 README） -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OG image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&amp;family=Noto+Serif+TC:wght@400;600&amp;display=block">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .card .floral { width: 330px; }
    .card .floral--tl { top: -6px; left: -12px; }
    .card .floral--br { right: -12px; bottom: -6px; }
    .card .eyebrow { font-size: 18px; margin-bottom: 18px; }
    .card .names { font-size: 68px; }
    .card .names-en { font-size: 36px; }
    .card .divider { width: 200px; margin: 22px auto; }
    .card .hero-date { font-size: 40px; }
    .card .hero-venue { font-size: 22px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="floral floral--tl" src="assets/img/floral.svg" alt="">
    <img class="floral floral--br" src="assets/img/floral.svg" alt="">
    <p class="eyebrow">Wedding Invitation</p>
    <h1 class="names">李大為<span class="amp">&amp;</span>周寒茹</h1>
    <p class="names-en">David &amp; Hanru</p>
    <svg class="divider" viewBox="0 0 200 20" aria-hidden="true">
      <path d="M0 10h82M118 10h82" stroke="currentColor" stroke-width="1"/>
      <path d="M100 16.5c-5-3.6-9-6.6-9-10a4.6 4.6 0 0 1 9-1.4 4.6 4.6 0 0 1 9 1.4c0 3.4-4 6.4-9 10z" fill="currentColor"/>
    </svg>
    <p class="hero-date">2026.10.03<span>SAT 17:30</span></p>
    <p class="hero-venue">豐邑新竹喜來登大飯店</p>
  </div>
</body>
</html>
